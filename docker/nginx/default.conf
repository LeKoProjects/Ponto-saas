server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 10m;

    # DNS do Docker: acha o container "php" mesmo depois de recriado (evita 502 após docker compose up).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream php:9000;

    # Arquivos públicos (logo das empresas) servidos direto da pasta.
    # Não depende do atalho public/storage, que criado no Windows não funciona no container.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
