name: ponto-saas

# Desenvolvimento com Docker.
#   Painel + API:  http://localhost:8000   (mude com APP_PORT)
#   App (PWA):     http://localhost:5173   (docker compose --profile pwa up -d)
#   E-mails:       http://localhost:8025   (Mailpit)
# Passo a passo no README ("Tudo em Docker").

x-app: &app
  build:
    context: ./docker/php
    dockerfile: Dockerfile
  image: ponto-saas-php
  env_file: ./ponto-api/.env
  environment:
    # Dentro do Docker os serviços se acham pelo nome (não por 127.0.0.1).
    DB_HOST: postgres
    DB_PORT: 5432
    REDIS_HOST: redis
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
    APP_URL: http://localhost:${APP_PORT:-8000}
    PONTO_OPENSSL_BIN: openssl # o do Linux (o .env pode apontar para o do Windows)
  volumes:
    - ./ponto-api:/var/www/html
    # vendor/ num volume do Docker: no Windows/macOS ler milhares de arquivos
    # da pasta montada deixa cada página com vários segundos.
    - vendor:/var/www/html/vendor
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./ponto-api:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    <<: *app
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      APP_URL: http://localhost:${APP_PORT:-8000}
      PONTO_OPENSSL_BIN: openssl
      INSTALL_DEPS: "1" # instala o vendor/ na primeira subida

  worker:
    <<: *app
    command: php artisan horizon

  scheduler:
    <<: *app
    command: php artisan schedule:work

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ponto
      POSTGRES_USER: ponto
      POSTGRES_PASSWORD: ponto
      TZ: America/Bahia
    ports:
      - "${DB_HOST_PORT:-5433}:5432"   # 5433 no host para não conflitar com Postgres local
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ponto -d ponto"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Caixa de e-mail de desenvolvimento: tudo que o sistema envia aparece em http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"

  # App do colaborador (Vite). node_modules próprio do Linux (o do Windows não serve no container).
  pwa:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:${APP_PORT:-8000}/api
      CHOKIDAR_USEPOLLING: "true" # recarga automática com a pasta do Windows
    ports:
      - "5173:5173"
    volumes:
      - ./ponto-pwa:/app
      - pwa_node_modules:/app/node_modules
    profiles: ["pwa"]

  # Ferramenta: compila os arquivos do painel (CSS/JS) num clone novo.
  #   docker compose run --rm assets
  assets:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run build"
    volumes:
      - ./ponto-api:/app
      - api_node_modules:/app/node_modules
    profiles: ["tools"]

volumes:
  pgdata:
  vendor:
  pwa_node_modules:
  api_node_modules:
